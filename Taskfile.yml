version: '3'

vars:
  APP_NAME: "mygit"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9246}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  version:sync:
    summary: Syncs VERSION file to build/config.yml and build/windows/info.json (optional VERSION=x.y.z)
    cmds:
      - |
        powershell -NoProfile -Command '
          $ErrorActionPreference = "Stop"
          $ver = "{{.VERSION}}".Trim().TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = (Get-Content "VERSION" -Raw).Trim().TrimStart("v")
          } else {
            [System.IO.File]::WriteAllText((Resolve-Path "VERSION").Path, "$ver`n", [System.Text.UTF8Encoding]::new($false))
          }
          $cfg = Get-Content "build/config.yml" -Raw
          $cfg = [regex]::Replace($cfg, "(?m)^(\s*version:\s*\"").*?(\"".*)$", "`${1}$ver`${2}")
          [System.IO.File]::WriteAllText((Resolve-Path "build/config.yml").Path, $cfg, [System.Text.UTF8Encoding]::new($false))
          $info = Get-Content "build/windows/info.json" -Raw | ConvertFrom-Json
          $info.fixed.file_version = $ver
          $info.info."0000".ProductVersion = $ver
          [System.IO.File]::WriteAllText((Resolve-Path "build/windows/info.json").Path, ($info | ConvertTo-Json -Depth 10), [System.Text.UTF8Encoding]::new($false))
          Write-Host "Synced version to $ver"
        '
