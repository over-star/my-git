name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1; leave empty to use git tag/ref)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20

      - name: Ensure NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y
          }

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go Tests
        run: go test ./internal/store/... ./internal/git/...

      - name: Build Binary & NSIS Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag.StartsWith("v")) {
            $verFromFile = (Get-Content "VERSION" -Raw).Trim().TrimStart("v")
            $tag = "v$verFromFile"
          }
          $ver = $tag.TrimStart("v")
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Keep Windows version metadata aligned with the release tag
          $infoPath = "build/windows/info.json"
          $infoJson = Get-Content $infoPath -Raw | ConvertFrom-Json
          $infoJson.fixed.file_version = $ver
          $infoJson.info."0000".ProductVersion = $ver
          [System.IO.File]::WriteAllText((Resolve-Path $infoPath).Path, ($infoJson | ConvertTo-Json -Depth 10), [System.Text.UTF8Encoding]::new($false))

          New-Item -ItemType Directory -Force -Path bin | Out-Null

          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.AppVersion=$ver" -o "bin/mygit.exe"
          Remove-Item -Force wails_windows_amd64.syso -ErrorAction SilentlyContinue

          wails3 generate webview2bootstrapper -dir "build/windows/nsis"
          $makensisCmd = Get-Command makensis -ErrorAction SilentlyContinue
          $makensis = if ($makensisCmd) { $makensisCmd.Source } else { "C:\Program Files (x86)\NSIS\makensis.exe" }
          $binPath = (Resolve-Path "bin\mygit.exe").Path

          Push-Location build/windows/nsis
          & $makensis "-DINFO_PRODUCTVERSION=$ver" "-DWAILS_INSTALL_SCOPE=user" "-DREQUEST_EXECUTION_LEVEL=user" "-DARG_WAILS_AMD64_BINARY=$binPath" project.nsi
          Pop-Location

          Compress-Archive -Path "bin\mygit.exe" -DestinationPath "bin\mygit-windows-amd64.zip" -Force
          $files = @("bin\mygit-amd64-installer.exe", "bin\mygit-windows-amd64.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $f -Leaf
            "$h  $name"
          }
          [System.IO.File]::WriteAllText((Resolve-Path "bin").Path + "\checksums.txt", ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            bin/mygit-amd64-installer.exe
            bin/mygit-windows-amd64.zip
            bin/checksums.txt
