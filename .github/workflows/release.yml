name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Binary & NSIS Installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X main.AppVersion=$ver" -o "bin/gitpulse.exe"
          Remove-Item -Force wails_windows_amd64.syso -ErrorAction SilentlyContinue

          wails3 generate webview2bootstrapper -dir "build/windows/nsis"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          $binPath = (Resolve-Path "bin\gitpulse.exe").Path
          Push-Location build/windows/nsis
          & $makensis "-DINFO_PRODUCTVERSION=$ver" "-DWAILS_INSTALL_SCOPE=user" "-DREQUEST_EXECUTION_LEVEL=user" "-DARG_WAILS_AMD64_BINARY=$binPath" project.nsi
          Pop-Location

          Compress-Archive -Path "bin\gitpulse.exe" -DestinationPath "bin\gitpulse-windows-amd64.zip" -Force
          $files = @("bin\gitpulse-amd64-installer.exe", "bin\gitpulse-windows-amd64.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $f -Leaf
            "$h  $name"
          }
          [System.IO.File]::WriteAllText((Resolve-Path "bin").Path + "\checksums.txt", ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/gitpulse-amd64-installer.exe
            bin/gitpulse-windows-amd64.zip
            bin/checksums.txt
